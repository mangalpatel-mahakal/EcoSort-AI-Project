<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signup | EcoSort AI</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                ♻️ EcoSort AI
            </div>

            <h2>Create Account</h2>

            <p class="subtitle">
                Join EcoSort AI and start your smart waste journey
            </p>

            <div class="input-group">
                <label>Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >
            </div>

            <div class="input-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                >
            </div>

            <button id="signupBtn">
                Create Account
            </button>

            <p id="message"></p>

            <p class="switch-page">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

    <script src="js/signup.js"></script>

</body>

</html>
