<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EcoSort AI</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                ♻️ EcoSort AI
            </div>

            <h2>Welcome Back</h2>

            <p class="subtitle">
                Login to continue your smart waste journey
            </p>

            <div class="input-group">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >
            </div>

            <div class="input-group">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                >
            </div>

            <button id="loginBtn">
                Login
            </button>

            <p id="message"></p>

            <p class="switch-page">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
